<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Longhand</title>
    <link rel="stylesheet" href="xterm.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Root regions only. Each area builds its own content into its region (see src/renderer/main.js). -->
    <header id="titlebar" data-tauri-drag-region></header>
    <main id="app">
      <aside id="files"></aside>
      <div class="split-v" data-target="files"></div>
      <section id="center">
        <div id="editor"></div>
        <div id="welcome"></div>
        <div class="split-h" data-target="bottom"></div>
        <div id="bottom"></div>
      </section>
      <div class="split-v" data-target="tutor"></div>
      <aside id="tutor"></aside>
    </main>
    <footer id="status"></footer>
    <script src="renderer.js"></script>
  </body>
</html>

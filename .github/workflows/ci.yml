name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  interface:
    name: Interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:ui

  backend:
    name: Backend
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: rustup show
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      # The notebook tests run the kernel helper against a real ipykernel when one loads; a venv
      # (this runner's Python refuses packages outside one) gives them one, so they run here.
      - name: Python with ipykernel for the notebook tests
        run: |
          python3 -m venv "$RUNNER_TEMP/kernel"
          "$RUNNER_TEMP/kernel/bin/python" -m pip install --quiet ipykernel
          echo "LONGHAND_TEST_KERNEL_PYTHON=$RUNNER_TEMP/kernel/bin/python" >> "$GITHUB_ENV"
      - run: cargo test
        working-directory: src-tauri

name: Release

# Pushing a tag like v0.2.0 builds a universal macOS app and publishes it as a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
        working-directory: src-tauri
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Longhand ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for what changed. The app is not yet notarized; the README explains how to open it.
          releaseDraft: false
          prerelease: false
          args: --target universal-apple-darwin
